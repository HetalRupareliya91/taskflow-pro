paths:
  /api/workspaces:
    get:
      summary: List workspaces
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: List of workspaces } }
    post:
      summary: Create a workspace
      responses: { '201': { description: Created }, '400': { description: Validation failed } }
  /api/workspaces/stats/summary:
    get:
      summary: Count workspaces by status
      responses: { '200': { description: Stats } }
  /api/workspaces/{id}:
    get: { summary: Get a workspace, responses: { '200': { description: OK }, '404': { description: Not found } } }
    patch: { summary: Update a workspace, responses: { '200': { description: OK }, '400': { description: Validation failed } } }
    delete: { summary: Delete a workspace, responses: { '204': { description: Deleted } } }
